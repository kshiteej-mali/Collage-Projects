<!DOCTYPE html> 
<html> 
    <head>
        <title>Nested Table with Image</title>
    </head> 
    <body> 
        <table border="2" cellpadding="8" cellspacing="0"> 
            <tr> 
                <td>Outer Cell 1</td> 
                <td> 
                    <table border="1" cellpadding="4"> 
                        <tr><td>Inner 1</td><td>Inner 2</td></tr> 
                        <tr><td>Inner 3</td><td>Inner 4</td></tr> 
                    </table> 
                </td> 
            </tr> 
            <tr> 
                <td>Outer Cell 3</td>  
                <td><img src="thumb.jpg" alt="Thumbnail" width="80"></td>         
            </tr>     
        </table> 
    </body> 
</html>
