<!DOCTYPE html> 
<html> 
    <head>
        <title>Image Alignment Demo</title>
    </head> 
    <body> 
        <h3>Left Aligned Image</h3> 
        <img src="pic1.jpg" alt="Left aligned picture" align="left" width="150"> 
        <p>This paragraph text wraps around the image that is aligned to the left side of the page using the align attribute.</p> 
        <br clear="left"> 
        <h3>Right Aligned Image</h3> 
        <img src="pic2.jpg" alt="Right aligned picture" align="right" width="150"> 
        <p>This paragraph text wraps around the image that is aligned to the right side of the page.</p> 
        <br clear="right"> 
        <h3>Center Aligned Image</h3> 
        <div style="text-align:center;"> 
            <img src="pic3.jpg" alt="Center aligned picture" width="150"> 
        </div> 
    </body> 
</html>
