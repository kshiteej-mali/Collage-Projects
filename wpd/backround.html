<!DOCTYPE html> 
<html> 
    <head> 
        <title>Background Properties Demo</title> 
        <style>     body {         background-color: lightyellow;     }     h1 {         border: 3px solid navy;         padding: 10px;         width: fit-content;     }     .highlighted-para {         background-image: url('paper-texture.jpg');         background-repeat: no-repeat;         padding: 15px;     } </style> 
    </head> 
    <body>     
        <h1>Background Properties</h1>       
        <p class="highlighted-para">         This paragraph has its own background image, separate from         the page background color, applied using the CSS background-image property on the paragraph's class selector. </p> 
    </body> 
</html> // important
