<html> 
    <head>     
        <title>Text Level Tags Demo</title> 
    </head> 
    <body>     
        <p><b>Bold Text</b></p>     
        <p><i>Italic Text</i></p>     
        <p><u>Underlined Text</u></p>     
        <p><tt>Teletype (monospace) Text</tt></p>     
        <p><strike>Strikethrough Text</strike></p>     
        <p>Water is H<sub>2</sub>O</p>     
        <p>Area is measured in m<sup>2</sup></p>     
        <div>This text is inside a DIV element.</div>     
        <p>Copyright symbol: &copy; &nbsp; Ampersand: &amp;</p>  
           <!-- This is an HTML comment, not visible on the page --> 
    </body> 
</html>
